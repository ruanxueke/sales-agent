name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Quality gate
        env:
          DATABASE_URL: sqlite:///ci.db
          AUTO_CREATE_TABLES: "false"
          REDIS_URL: ""
        run: python scripts/quality_gate.py
      - name: Desktop syntax
        working-directory: desktop-client
        run: node --check main.js
      - name: Desktop build
        working-directory: desktop-client
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm ci && npm run build
      - name: Verify release artifacts
        run: python scripts/verify_release.py
      - name: Verify signed release
        if: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        run: python scripts/verify_release.py --require-signed
