name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check Python syntax
        run: |
          python -m compileall -q \
            api \
            config \
            connectors \
            core \
            desktop_app \
            knowledge \
            scripts \
            tests \
            utils \
            vision_agent \
            wechat_bridge

      - name: Check desktop syntax
        run: |
          node --check desktop-client/main.js
          node --check desktop-client/preload.js

      - name: Check text encoding
        run: python scripts/quality_gate.py --only mojibake

      - name: Reject tracked runtime secrets
        run: python scripts/check_public_release.py
