[pytest]
# 项目里的 tests/test_*.py 大多是从命令行直接跑的自测脚本（靠 print + 退出码），
# 不是 pytest 用例；顶层副作用重的那些统一在 tests/conftest.py 的 collect_ignore
# 里排除——pytest 9 不再支持在 ini 里写 collect_ignore_glob。
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
# 单个用例超时（需要 requirements-dev.txt 里的 pytest-timeout；未安装时该行会被
# 忽略并给出 warning，不影响其它用例）
timeout = 300
addopts = -p no:cacheprovider
