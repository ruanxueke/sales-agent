<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中台桌面版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:#0f172a;color:#fff}
#frame{width:100%;height:100%;border:0}
.panel{position:fixed;top:14px;right:14px;z-index:9999;width:340px;background:#0f172a;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.panel h2{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
input{flex:1;padding:8px 10px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:#1e293b;color:#fff;font-size:12px}
button{padding:8px 12px;border:1px solid rgba(255,255,255,.25);border-radius:6px;background:#1e293b;color:#fff;font-size:12px;cursor:pointer}
button.primary{background:#2563eb;border-color:#2563eb}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:#94a3b8;margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;background:#64748b}
.dot.on{background:#22c55e}.dot.off{background:#ef4444}
.switch{position:relative;width:42px;height:22px;background:#334155;border-radius:999px;cursor:pointer;transition:.2s}
.switch.on{background:#2563eb}.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{left:22px}
.note{font-size:11px;color:#64748b;line-height:1.5;margin-top:8px}
.hidden{display:none}
</style>
</head>
<body>
<iframe id="frame" src="/static/console.html"></iframe>
<div class="panel" id="panel">
  <h2>🖥️ 视觉执行器桌面控制</h2>
  <div class="row">
    <input type="password" id="apiKey" placeholder="中台 API Key 或账号密码（网页版内登录）">
    <button class="primary" onclick="saveKey()">保存</button>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">未连接</span></div>
  <div class="row">
    <span style="font-size:13px">启用视觉执行器</span>
    <div class="switch" id="switch" onclick="toggle()"><span></span></div>
  </div>
  <div class="note" id="note">桌面版：登录后开启开关才会开始自动回复；关闭立即停止。界面已完整还原网页版中台，视觉执行器保留在“自动化通道”和右侧控制面板。</div>
</div>
<script>
const hasElectronBridge = !!(window.desktopApi && window.desktopApi.login);
const hasPywebviewBridge = !!(window.pywebview && window.pywebview.api);
const hasBridge = hasElectronBridge || hasPywebviewBridge;
const keyInput = document.getElementById("apiKey");
const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const sw = document.getElementById("switch");
const note = document.getElementById("note");
keyInput.value = localStorage.getItem("sales_api_key") || "";

async function callApi(method, ...args) {
  if (hasElectronBridge) return window.desktopApi[method](...args);
  if (hasPywebviewBridge) return window.pywebview.api[method](...args);
  return {};
}

async function saveKey() {
  const key = keyInput.value.trim();
  localStorage.setItem("sales_api_key", key);
  if (hasElectronBridge) await callApi("login", key);
  if (hasPywebviewBridge) await callApi("set_api_key", key);
  note.textContent = "已保存，刷新中台界面...";
  setTimeout(() => document.getElementById("frame").src = "/static/console.html?" + Date.now(), 600);
  refresh();
}

async function toggle() {
  if (!hasBridge) { note.textContent = "浏览器模式：无法控制视觉执行器，请使用桌面版。"; return; }
  const willOn = !sw.classList.contains("on");
  const r = willOn ? await callApi("startVision") : await callApi("stopVision");
  if (r && r.ok === false) note.textContent = r.error || "操作失败";
  refresh();
}

async function refresh() {
  if (!hasBridge) { dot.className = "dot off"; statusText.textContent = "桌面版未连接"; return; }
  const s = await callApi("getStatus");
  if (s && s.api_key_set) { dot.className = "dot on"; statusText.textContent = "已登录"; } else { dot.className = "dot off"; statusText.textContent = "未登录"; }
  if (s && s.enabled) { sw.classList.add("on"); statusText.textContent = "运行中"; dot.className = "dot on"; }
  else { sw.classList.remove("on"); }
}

if (hasBridge && keyInput.value) { callApi("login", keyInput.value); refresh(); }
setInterval(refresh, 3000);
</script>
</body>
</html>
