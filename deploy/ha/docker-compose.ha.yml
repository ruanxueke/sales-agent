services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api-1:
    build: .
    command: python api_server.py
    environment:
      - REDIS_URL=redis://redis:6379/0
      - INSTANCE_ID=api-1
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
    env_file:
      - .env
    restart: unless-stopped

  api-2:
    build: .
    command: python api_server.py
    environment:
      - REDIS_URL=redis://redis:6379/0
      - INSTANCE_ID=api-2
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
    env_file:
      - .env
    restart: unless-stopped

  official:
    build: .
    command: python main.py --channel official
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
    env_file:
      - .env
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/ha/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
      - official
    restart: unless-stopped

volumes:
  redis-data:
